# Vars shared by every host in cloud_1_server.
# Anything that differs per server (domain, deploy path, credentials, SSL
# certs) lives in host_vars/<hostname>/ instead - see host_vars/server1/
# and host_vars/server2/ (template) for the per-host pattern.

ansible_user: cloud-1
ansible_python_interpreter: /usr/bin/python3

# MariaDB connection settings shared by every stack (container name/port
# inside the docker compose network is the same on every host)
db_host: "mariadb"
db_port: "3306"
