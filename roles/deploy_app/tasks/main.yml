# Orchestrates the stack as a whole. Each service's own files/config are
# staged by its own role (mariadb, wordpress, nginx, phpmyadmin, adminer),
# which must run before this one.

- name: Create application directory
  file:
      path: "{{ app_deploy_path }}"
      state: directory
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0755'
  become: yes

- name: Deploy docker-compose from template
  template:
      src: docker-compose.yml.j2
      dest: "{{ app_deploy_path }}/docker-compose.yml"
      owner: "{{ ansible_user }}"
      group: "{{ ansible_user }}"
      mode: '0644'

- name: Build and start Docker containers
  command: docker compose up -d --build
  args:
      chdir: "{{ app_deploy_path }}"

- name: Wait for MariaDB to be ready
  command: docker exec mariadb mariadb -u {{ db_user }} -p{{ db_pass }} -e "SELECT 1" {{ db_name }}
  register: mariadb_ready
  until: mariadb_ready.rc == 0
  retries: 20
  delay: 5
  ignore_errors: yes

- name: Wait for WordPress to be ready
  command: docker exec wordpress test -f /var/www/wordpress/wp-config.php
  register: wordpress_ready
  until: wordpress_ready.rc == 0
  retries: 30
  delay: 10
  ignore_errors: yes

- name: Wait for Nginx to be ready
  uri:
      url: "{{ app_url }}"
      status_code: 200,301,302
  register: nginx_ready
  until: nginx_ready.status in [200, 301, 302]
  retries: 10
  delay: 5
  ignore_errors: yes

- name: Display running containers
  command: docker compose ps
  args:
      chdir: "{{ app_deploy_path }}"
  register: docker_ps
  changed_when: false

- name: Show container status
  debug:
      msg: "{{ docker_ps.stdout_lines }}"
